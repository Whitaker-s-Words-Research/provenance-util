# Build and test on Linux and macOS.
#
# The integration tests need git-ai. Where git-ai is not installed, they print
# "SKIPPED" and pass, so this job then checks only the build and the unit tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it at the first cargo command.
      - name: Show versions
        run: cargo --version && git --version
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

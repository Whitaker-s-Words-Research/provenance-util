# Release builds, from Cargo.lock with --locked. The release notes give the
# SHA-256 of each binary.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: prov-linux-x86_64
          - os: macos-latest
            name: prov-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked -p prov
      - name: Name the binary and hash it
        run: |
          cp target/release/prov "${{ matrix.name }}"
          shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"
          cat "${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "SHA-256 of each binary:"
            echo
            echo '```'
            cat ./*.sha256
            echo '```'
          } > notes.md
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --notes-file notes.md prov-linux-x86_64 prov-macos-aarch64

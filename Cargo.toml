[workspace]
resolver = "2"
members = ["crates/prov-core", "crates/prov-git", "crates/prov-adapters", "crates/prov-gitai", "crates/prov"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.100.0"
repository = "https://github.com/Whitaker-s-Words-Research/provenance-util"
# Released as binaries on GitHub, not on crates.io.
publish = false

# One set of lints for local runs and CI. CI fails on any warning.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# For a library API; these crates are internal to the binary.
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Each command's `run` is one long sequence of steps; command-line flags are bools.
too_many_lines = "allow"
struct_excessive_bools = "allow"
# A panic in a git or agent hook is the worst way to fail. Tests may unwrap.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
semver = "1"
sha2 = "0.10"
sha1 = "0.10"
regex-lite = "0.1"
flate2 = "1"
tar = { version = "0.4", default-features = false }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
prov-core = { path = "crates/prov-core" }
prov-git = { path = "crates/prov-git" }
prov-adapters = { path = "crates/prov-adapters" }
prov-gitai = { path = "crates/prov-gitai" }
